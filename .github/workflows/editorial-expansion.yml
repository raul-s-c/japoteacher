name: Daily editorial expansion

on:
  workflow_dispatch:
    inputs:
      token_budget:
        description: Editorial token budget for this run
        default: "1500000"
        required: true
      generation_budget:
        description: Generation phase token budget
        default: "1300000"
        required: true
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write

concurrency:
  group: daily-editorial-expansion
  cancel-in-progress: false

jobs:
  expand:
    runs-on: windows-latest
    env:
      TOKEN_BUDGET: ${{ github.event.inputs.token_budget || '1500000' }}
      GENERATION_BUDGET: ${{ github.event.inputs.generation_budget || '1300000' }}
      JAPOTEACHER_EDITORIAL_KEY: ${{ secrets.JAPOTEACHER_EDITORIAL_KEY || secrets.PROXY_TOKEN }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      SMTP_ENABLE_SSL: ${{ secrets.SMTP_ENABLE_SSL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compute usage baseline
        shell: pwsh
        run: |
          $baseline = python -c "import json,pathlib; p=pathlib.Path('data/editorial/usage.jsonl'); print(sum((json.loads(x).get('usage') or {}).get('total_tokens',(json.loads(x).get('usage') or {}).get('input_tokens',0)+(json.loads(x).get('usage') or {}).get('output_tokens',0)) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()) if p.exists() else 0)"
          "USAGE_BASELINE=$baseline" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run adaptive expansion
        shell: pwsh
        run: |
          if (-not $env:JAPOTEACHER_EDITORIAL_KEY) {
            throw "Falta JAPOTEACHER_EDITORIAL_KEY o PROXY_TOKEN en GitHub Secrets."
          }
          ./scripts/run-adaptive-editorial-expansion.ps1 `
            -TokenBudget ([int]$env:TOKEN_BUDGET) `
            -GenerationBudget ([int]$env:GENERATION_BUDGET) `
            -UsageBaseline ([long]$env:USAGE_BASELINE)

      - name: Run unit tests
        shell: pwsh
        run: node --test tests/*.test.mjs

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          $summaryPath = Join-Path $env:RUNNER_TEMP "editorial-summary.md"
          $env:SUMMARY_PATH = $summaryPath
          node scripts/editorial-daily-summary.mjs $env:USAGE_BASELINE
          Get-Content $summaryPath | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "SUMMARY_PATH=$summaryPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Commit editorial changes
        if: success()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/exercises.full.csv data/jlpt-bank-audit.json data/editorial/*.jsonl src/furigana-generated.js
          if (-not (git diff --cached --quiet)) {
            git commit -m "Run daily editorial expansion"
            git push
          } else {
            Write-Host "No editorial changes to commit."
          }

      - name: Email daily summary
        if: always()
        shell: pwsh
        run: |
          if (-not $env:SMTP_SERVER -or -not $env:SMTP_PORT -or -not $env:SMTP_USERNAME -or -not $env:SMTP_PASSWORD -or -not $env:SMTP_FROM -or -not $env:SMTP_TO) {
            Write-Warning "No se envia email: faltan secretos SMTP_*."
            exit 0
          }
          $body = Get-Content $env:SUMMARY_PATH -Raw
          if ("${{ job.status }}" -ne "success") {
            $body = "# La expansion editorial necesita revision`n`nEstado del job: ${{ job.status }}`n`n" + $body
          }
          $message = [System.Net.Mail.MailMessage]::new()
          $message.From = $env:SMTP_FROM
          $message.To.Add($env:SMTP_TO)
          $message.Subject = "JapoTeacher - resumen editorial diario - ${{ job.status }}"
          $message.Body = $body
          $message.IsBodyHtml = $false
          $client = [System.Net.Mail.SmtpClient]::new($env:SMTP_SERVER, [int]$env:SMTP_PORT)
          $client.EnableSsl = $env:SMTP_ENABLE_SSL -ne "false"
          $client.Credentials = [System.Net.NetworkCredential]::new($env:SMTP_USERNAME, $env:SMTP_PASSWORD)
          $client.Send($message)
