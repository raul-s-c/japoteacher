<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Descargar JapoTeacher para Android</title>
<style>body{margin:0;background:#f8f6f1;color:#24211e;font:17px/1.6 system-ui,sans-serif}main{max-width:540px;margin:8vh auto;padding:24px}h1{font: bold 34px Georgia,serif}a{color:#9f2118}#download{display:block;padding:15px 20px;background:#9f2118;color:white;border-radius:10px;text-align:center;font-weight:bold;text-decoration:none}small{overflow-wrap:anywhere}li{margin-bottom:8px}[hidden]{display:none!important}</style></head>
<body><main><p>JapoTeacher · Android</p><h1>La última APK, aquí</h1><p id="status" role="status">Consultando la última versión…</p><a id="download" hidden>Descargar APK</a><p>Instálala encima de tu versión actual, sin desinstalar, para conservar los datos locales.</p><ul id="notes"></ul><details id="verification" hidden><summary>Verificar descarga</summary><small id="hash"></small></details><p><a href="https://github.com/raul-s-c/japoteacher">Volver al repositorio</a> · <a href="https://github.com/raul-s-c/japoteacher/tree/main/releases/android">Versiones anteriores</a></p><noscript>Activa JavaScript para consultar la versión vigente o utiliza el enlace a los archivos de versiones anteriores.</noscript></main>
<script>
(async()=>{try{const response=await fetch('android-version.json',{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json(),url=new URL(data.apkUrl||data.apk_url);if(url.protocol!=='https:'||url.host!=='raw.githubusercontent.com'||!url.pathname.startsWith('/raul-s-c/japoteacher/main/releases/android/')||!url.pathname.endsWith('.apk'))throw Error();document.getElementById('status').textContent='Versión '+data.versionName;const button=document.getElementById('download');button.href=url.href;button.textContent='Descargar JapoTeacher '+data.versionName+' · APK';button.hidden=false;for(const note of data.notes||[]){const li=document.createElement('li');li.textContent=note;document.getElementById('notes').append(li)}if(data.sha256){document.getElementById('hash').textContent='SHA-256: '+data.sha256;document.getElementById('verification').hidden=false}}catch{document.getElementById('status').textContent='No se pudo consultar la última versión. Recarga la página o abre los archivos de versiones anteriores.'}})();
</script></body></html>
