<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Explicación de lupa</title>
  <link rel="stylesheet" href="src/lens-overlay.css?v=2">
</head>
<body>
  <main class="overlay-sheet" aria-labelledby="overlayTitle">
    <header class="overlay-header">
      <div><span class="kicker">Lupa IA</span><h1 id="overlayTitle">Explicación</h1></div>
      <button id="overlaySettings" class="icon-button compact-only" type="button" aria-label="Ajustes de lupa">⚙</button>
      <button class="icon-button" id="closeOverlay" type="button" aria-label="Minimizar resultado y seguir leyendo">×</button>
    </header>
    <section id="overlayStatus" class="overlay-status" aria-live="polite">
      <span class="spinner"></span><div><strong>Preparando la explicación</strong><p>Traduciendo y ordenando los puntos importantes.</p></div>
    </section>
    <article id="overlayResult" hidden></article>
    <details id="overlayChat" class="overlay-chat" hidden>
      <summary>Preguntar sobre este fragmento</summary>
      <div id="overlayThread" class="overlay-thread"></div>
      <label for="overlayQuestion">Pregunta</label>
      <textarea id="overlayQuestion" rows="2" maxlength="900" placeholder="¿Qué matiz tiene esta palabra? ¿Por qué se usa esta partícula?"></textarea>
      <button id="overlayAsk" type="button">Preguntar</button>
    </details>
    <footer class="overlay-actions">
      <button id="recaptureOverlay" class="secondary" type="button">Siguiente recorte</button>
      <button id="finishOverlay" type="button">Minimizar</button>
    </footer>
  </main>

  <div class="cloud-hooks" aria-hidden="true">
    <div id="authSignedOut"><input id="authEmail"><input id="authPassword"><button id="signUpButton"></button><button id="signInButton"></button></div>
    <div id="authSignedIn"><span id="authUserEmail"></span><button id="signOutButton"></button></div>
    <span id="cloudStatus"></span><div id="sessionLock"><span id="sessionLockMessage"></span><button id="takeSessionButton"></button><button id="sessionLockSignOut"></button></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="src/supabase-config.js?v=11"></script>
  <script src="src/db.js?v=33"></script>
  <script src="src/sync-policy.js?v=2"></script>
  <script src="src/cloud-sync.js?v=37"></script>
  <script src="src/lens-overlay.js?v=2"></script>
</body>
</html>
